# Include inside nginx http {} via sites-enabled, only after a valid HTTPS
# certificate exists. Public no-login Parser Studio; other hosts unchanged.
# The only public host of Parser Studio. The certificate is the shared ISOC
# certificate (it also names other ISOC hosts and is renewed outside this
# repository through the ACME web root below).
map "$request_method|$http_origin" $parser_studio_reject_post_origin {
    default 0;
    "POST|https://app.parser.isoc.ooo" 0;
    ~^POST\| 1;
}

server {
    listen 80;
    listen [::]:80;
    server_name app.parser.isoc.ooo;

    location ^~ /.well-known/acme-challenge/ {
        root /var/www/parser-studio-acme;
        default_type text/plain;
        try_files $uri =404;
    }
    location / { return 301 https://app.parser.isoc.ooo$request_uri; }
}

server {
    listen 443 ssl;
    listen [::]:443 ssl;
    server_name app.parser.isoc.ooo;

    ssl_certificate /etc/letsencrypt/live/isoc-app-services/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/isoc-app-services/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    # This block can be the default server of the listener and then also receives requests for names that no site
    # of this Nginx claims (another host name, the bare address). Parser Studio answers under its own name only.
    if ($host != "app.parser.isoc.ooo") { return 421; }

    client_max_body_size 3m;
    add_header Cache-Control "private, no-store" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "no-referrer" always;

    root /var/www/parser-studio-app;
    index index.html;

    # Only verified offline authoring and bounded source preview endpoints
    # are available. No target, sensor, Test Lab or tenant routes are exposed.
    location ^~ /api/v1/parser-pairs/ {
        if ($parser_studio_reject_post_origin) { return 403; }
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:4305;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_read_timeout 60s;
        proxy_buffering off;
    }

    location = /api/v1/multipass/preview {
        if ($request_method !~ ^POST$) { return 405; }
        if ($parser_studio_reject_post_origin) { return 403; }
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:4304;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location = /api/v1/multipass/preview-batch {
        if ($request_method !~ ^POST$) { return 405; }
        if ($parser_studio_reject_post_origin) { return 403; }
        proxy_http_version 1.1;
        proxy_pass http://127.0.0.1:4304;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-Proto https;
        proxy_read_timeout 60s;
    }

    location ^~ /api/ { return 404; }
    location / {
        try_files $uri $uri/ /index.html;
    }
}
